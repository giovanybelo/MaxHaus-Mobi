<text x="1050.0" y="361.0" font-family="Helvetica, Arial, sans-serif" font-size="8.0" fill="#000000" font-weight="bold" text-anchor="start">O que muda.</text>
<text x="1050.0" y="372.4" font-family="Helvetica, Arial, sans-serif" font-size="8.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">A altura do vão passa de 2103 (R95) para 2150 mm e a porta fica 0,33 m mais ao</text>
<text x="1050.0" y="383.8" font-family="Helvetica, Arial, sans-serif" font-size="8.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">sul do que nas plantas antigas. A folha da R95 (2088) não serve: a nova tem 2135</text>
<text x="1050.0" y="395.2" font-family="Helvetica, Arial, sans-serif" font-size="8.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">mm.</text>
<text x="1050.0" y="413.6" font-family="Helvetica, Arial, sans-serif" font-size="8.0" fill="#000000" font-weight="bold" text-anchor="start">Por dentro e por fora.</text>
<text x="1050.0" y="425.0" font-family="Helvetica, Arial, sans-serif" font-size="8.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">De dentro, empurra-se com a mão direita. De fora, puxa-se com a esquerda.</text>
<text x="1050.0" y="436.4" font-family="Helvetica, Arial, sans-serif" font-size="8.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">Aberta, a folha encosta ao norte do vão.</text>
<text x="1050.0" y="454.8" font-family="Helvetica, Arial, sans-serif" font-size="8.0" fill="#000000" font-weight="bold" text-anchor="start">Verga.</text>
<text x="1050.0" y="466.2" font-family="Helvetica, Arial, sans-serif" font-size="8.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">Com o vão a 2150, sobram 350 mm de parede até o forro. Conferir a verga</text>
<text x="1050.0" y="477.6" font-family="Helvetica, Arial, sans-serif" font-size="8.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">existente antes de abrir ou fechar o vão.</text>
<text x="1050.0" y="496.0" font-family="Helvetica, Arial, sans-serif" font-size="8.0" fill="#000000" font-weight="bold" text-anchor="start">Piso.</text>
<text x="1050.0" y="507.4" font-family="Helvetica, Arial, sans-serif" font-size="8.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">Perfil de metal no eixo da folha fechada (BE-03). A folga de 12 mm embaixo é</text>
<text x="1050.0" y="518.8" font-family="Helvetica, Arial, sans-serif" font-size="8.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">medida sobre o piso pronto.</text>
