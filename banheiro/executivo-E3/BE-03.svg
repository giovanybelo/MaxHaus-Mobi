<text x="674.0" y="305.5" font-family="Helvetica, Arial, sans-serif" font-size="6.8" fill="#4d4d4d" font-weight="normal" text-anchor="middle" transform="rotate(-90.0 674.0 305.5)">3</text>
<text x="70.0" y="530.0" font-family="Helvetica, Arial, sans-serif" font-size="9.4" fill="#000000" font-weight="bold" text-anchor="start">CORTE B  ·  box, de leste para oeste</text>
<text x="70.0" y="543.0" font-family="Helvetica, Arial, sans-serif" font-size="7.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">da parede da porta (direita) até o ralo linear junto à área técnica (esquerda)</text>
