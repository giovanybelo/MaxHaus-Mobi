<text x="660.0" y="650.7" font-family="Helvetica, Arial, sans-serif" font-size="7.0" fill="#000000" font-weight="bold" text-anchor="end">-10 na entrada do box</text>
<text x="218.3" y="775.0" font-family="Helvetica, Arial, sans-serif" font-size="7.0" fill="#000000" font-weight="bold" text-anchor="middle">R1 · ralo linear a -25</text>
<text x="439.2" y="667.0" font-family="Helvetica, Arial, sans-serif" font-size="7.0" fill="#4d4d4d" font-weight="normal" text-anchor="middle">caimento ~1,5% (15 mm em 1,02 m)</text>
<text x="760.0" y="142.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="start" letter-spacing="1.00">NÍVEIS — REFERÊNCIA ±0 NO PISO PRONTO</text>
<rect x="760.00" y="150.00" width="592.00" height="17.00" fill="#e0e0e0"/>
<text x="766.0" y="161.2" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="start">Ponto</text>
<text x="1109.2" y="161.2" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="end">Nível</text>
<text x="1346.0" y="161.2" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="end">Como se chega</text>
<text x="766.0" y="178.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Piso pronto da sala (monolítico)</text>
<text x="1109.2" y="178.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">±0</text>
<text x="1346.0" y="178.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">referência da obra</text>
<line x1="760.00" y1="184.00" x2="1352.00" y2="184.00" stroke="#cccccc" stroke-width="0.50"/>
<rect x="760.00" y="184.00" width="592.00" height="17.00" fill="#f5f5f5"/>
<text x="766.0" y="195.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Piso pronto do banheiro</text>
<text x="1109.2" y="195.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">±0</text>
<text x="1346.0" y="195.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">porcelanato 9 + argamassa ~5</text>
<line x1="760.00" y1="201.00" x2="1352.00" y2="201.00" stroke="#cccccc" stroke-width="0.50"/>
<text x="766.0" y="212.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Base do banheiro, sob a argamassa</text>
<text x="1109.2" y="212.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">-14</text>
<text x="1346.0" y="212.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">mais impermeabilização e proteção</text>
<line x1="760.00" y1="218.00" x2="1352.00" y2="218.00" stroke="#cccccc" stroke-width="0.50"/>
<rect x="760.00" y="218.00" width="592.00" height="17.00" fill="#f5f5f5"/>
<text x="766.0" y="229.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Base da sala, sob o monolítico</text>
<text x="1109.2" y="229.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">-2 a -4</text>
<text x="1346.0" y="229.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">conforme o sistema Sinesse Pro</text>
<line x1="760.00" y1="235.00" x2="1352.00" y2="235.00" stroke="#cccccc" stroke-width="0.50"/>
<text x="766.0" y="246.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Entrada do box, na linha do vidro</text>
<text x="1109.2" y="246.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">-10</text>
<text x="1346.0" y="246.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">desnível de contenção</text>
<line x1="760.00" y1="252.00" x2="1352.00" y2="252.00" stroke="#cccccc" stroke-width="0.50"/>
<rect x="760.00" y="252.00" width="592.00" height="17.00" fill="#f5f5f5"/>
<text x="766.0" y="263.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Ralo linear R1</text>
<text x="1109.2" y="263.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">-25</text>
<text x="1346.0" y="263.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">ponto mais baixo</text>
<line x1="760.00" y1="269.00" x2="1352.00" y2="269.00" stroke="#cccccc" stroke-width="0.50"/>
<text x="766.0" y="280.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Ralo R2, ao lado do vaso</text>
<text x="1109.2" y="280.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">-3 a -5</text>
<text x="1346.0" y="280.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">caimento leve do piso seco</text>
<line x1="760.00" y1="286.00" x2="1352.00" y2="286.00" stroke="#cccccc" stroke-width="0.50"/>
<text x="760.0" y="312.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">A base do banheiro fica 10 a 12 mm abaixo da base da sala.</text>
<text x="760.0" y="324.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">É a conta 9 + 5 - (2 a 4). Somar a espessura real da impermeabilização e da proteção. Conferir a espessura do Confete na etiqueta do lote: há catálogo</text>
<text x="760.0" y="336.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">antigo com 10,8 mm.</text>
<text x="760.0" y="355.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Rebaixar não é quebrar laje.</text>
<text x="760.0" y="367.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Depois de tirar o piso antigo, medir o que sobrou. Se a altura já existe, só regularizar; se faltar, retirar contrapiso, nunca a laje. Registrar base existente,</text>
<text x="760.0" y="379.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">base alvo e a diferença.</text>
<text x="760.0" y="398.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Perfil de metal no vão da porta.</text>
<text x="760.0" y="410.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Um perfil com 3 mm à vista, topo no nível do piso pronto, no eixo da folha fechada. Junta elástica dos dois lados. Sem soleira e sem degrau; a folha da</text>
<text x="760.0" y="422.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">P02 fica com 12 mm de folga embaixo.</text>
<text x="760.0" y="441.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">O esgoto manda no rebaixo.</text>
<text x="760.0" y="453.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Vaso e os dois ralos precisam de queda até a prumada. Se o piso sobe ou desce, conferir a cota de saída de cada um antes de fechar o nível. Sem</text>
<text x="760.0" y="465.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">queda, não se libera a regularização.</text>
<text x="760.0" y="484.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Retorno curto junto à área técnica.</text>
<text x="760.0" y="496.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Entre o ralo linear e a área técnica sobram ~60 mm. Não manter ali o -10 da entrada do box: o piso desse trecho acompanha a borda do ralo. Decidir com</text>
<text x="760.0" y="508.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">o responsável técnico antes de cortar o porcelanato.</text>
</svg>