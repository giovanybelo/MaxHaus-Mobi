<rect x="70.00" y="431.00" width="590.00" height="26.00" fill="#8c8c8c"/>
<text x="365.0" y="448.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#ffffff" font-weight="bold" text-anchor="middle">LAJE  ·  não rebaixar</text>
<rect x="367.00" y="300.00" width="5.00" height="51.33" fill="#ff00ff"/>
<line x1="50.00" y1="300.00" x2="690.00" y2="300.00" stroke="#ff00ff" stroke-width="0.90"/>
<text x="694.0" y="303.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#ff00ff" font-weight="bold" text-anchor="start">±0  piso pronto</text>
<text x="78.0" y="319.0" font-family="Helvetica, Arial, sans-serif" font-size="6.8" fill="#000000" font-weight="normal" text-anchor="start">porcelanato Confete, 9 mm</text>
<text x="78.0" y="344.7" font-family="Helvetica, Arial, sans-serif" font-size="6.8" fill="#000000" font-weight="normal" text-anchor="start">argamassa colante, ~5 mm</text>
<text x="78.0" y="361.2" font-family="Helvetica, Arial, sans-serif" font-size="6.8" fill="#000000" font-weight="normal" text-anchor="start">impermeabilização + proteção</text>
<text x="78.0" y="398.5" font-family="Helvetica, Arial, sans-serif" font-size="6.8" fill="#000000" font-weight="normal" text-anchor="start">regularização com caimento (contrapiso)</text>
<text x="382.0" y="327.0" font-family="Helvetica, Arial, sans-serif" font-size="6.8" fill="#000000" font-weight="normal" text-anchor="start">monolítico Sinesse Pro, 2 a 4 mm, sobre a base preparada</text>
<text x="369.0" y="278.0" font-family="Helvetica, Arial, sans-serif" font-size="7.0" fill="#ff00ff" font-weight="bold" text-anchor="middle">perfil de metal, 3 mm à vista</text>
<line x1="369.50" y1="282.00" x2="369.50" y2="298.00" stroke="#ff00ff" stroke-width="0.70"/>
<text x="220.0" y="290.0" font-family="Helvetica, Arial, sans-serif" font-size="8.0" fill="#000000" font-weight="bold" text-anchor="middle" letter-spacing="0.80">BANHEIRO</text>
<text x="520.0" y="290.0" font-family="Helvetica, Arial, sans-serif" font-size="8.0" fill="#000000" font-weight="bold" text-anchor="middle" letter-spacing="0.80">SALA DE TV</text>
