<text x="813.4" y="605.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">TE.4676 · Tiny embutido, 5,8 W, 36°, 2700 K, bivolt, IP</text>
<text x="1192.1" y="605.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">1</text>
<text x="1346.0" y="605.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">dentro do box</text>
<line x1="760.00" y1="611.00" x2="1352.00" y2="611.00" stroke="#cccccc" stroke-width="0.50"/>
<text x="760.0" y="637.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Altura livre no forro.</text>
<text x="760.0" y="649.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">A FAS pede no mínimo 100 mm entre a laje e o forro. Com a laje a +2620 e o forro a +2500 sobram 120 mm, menos os 15 mm da placa: 105 mm. Não</text>
<text x="760.0" y="661.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">baixar o forro menos que isso; conferir a altura real da laje depois de tirar o forro antigo.</text>
<text x="760.0" y="680.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Posições.</text>
<text x="760.0" y="692.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">D1 no centro da área livre, entre a bancada e a parede da porta. D2 no box, afastado ~300 mm do eixo do chuveiro. São as posições do modelo R95</text>
<text x="760.0" y="704.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">adaptadas às medidas novas: conferir com a folha F01 da FAS (planta), que não está neste pacote.</text>
<text x="760.0" y="723.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Forro.</text>
<text x="760.0" y="735.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Gesso resistente à umidade, com tabica no perímetro. O revestimento das paredes termina no forro (+2500). Furos das luminárias só com a peça em mãos;</text>
