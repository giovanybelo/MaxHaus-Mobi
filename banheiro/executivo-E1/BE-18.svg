<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 990" width="1400" height="990">
<rect x="0.00" y="0.00" width="1400.00" height="990.00" fill="#ffffff"/>
<text x="48.0" y="42.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4d4d4d" font-weight="bold" text-anchor="start" letter-spacing="1.40">MAXHAUS 81  ·  BANHEIRO  ·  CADERNO EXECUTIVO</text>
<text x="48.0" y="76.0" font-family="Helvetica, Arial, sans-serif" font-size="24.0" fill="#000000" font-weight="bold" text-anchor="start">Sequência de execução</text>
<text x="48.0" y="97.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">A ordem dos serviços e os pontos em que a obra para até alguém conferir. Em amarelo, as liberações.</text>
<text x="1352.0" y="42.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#ff00ff" font-weight="bold" text-anchor="end" letter-spacing="0.80">E1  ·  14/11/2026</text>
<text x="1352.0" y="78.0" font-family="Helvetica, Arial, sans-serif" font-size="22.0" fill="#000000" font-weight="bold" text-anchor="end">BE-18</text>
<text x="1352.0" y="97.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="end">escala sem escala  ·  A3, imprimir a 100%</text>
<line x1="48.00" y1="112.00" x2="1352.00" y2="112.00" stroke="#cccccc" stroke-width="1.00"/>
<line x1="48.00" y1="928.00" x2="1352.00" y2="928.00" stroke="#cccccc" stroke-width="1.00"/>
<text x="48.0" y="944.0" font-family="Helvetica, Arial, sans-serif" font-size="7.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">Cotas em mm, em faces acabadas; nível ±0 = piso pronto. Medidas de 14/11/2026 informadas pelo cliente + modelo R95. Conferir em obra depois da demolição e antes de cortar qualquer peça.</text>
<text x="48.0" y="956.0" font-family="Helvetica, Arial, sans-serif" font-size="7.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">Orientação de escopo, não laudo: instalações, estrutura e impermeabilização pedem responsável técnico em obra.</text>
<text x="48.0" y="975.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#ff00ff" font-weight="bold" text-anchor="start" letter-spacing="0.50">MAXHAUS 81  ·  JOÃO BALDINATO 109  ·  BANHEIRO  ·  CADERNO EXECUTIVO</text>
<text x="1352.0" y="975.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="end">BE-18   ·   E1  ·  14/11/2026</text>
<circle cx="56.00" cy="157.00" r="8.00" fill="#ffffff" stroke="#000000" stroke-width="1.00"/>
<text x="56.0" y="160.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">1</text>
<text x="72.0" y="160.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#000000" font-weight="bold" text-anchor="start">Proteção e registros.</text>
<text x="72.0" y="173.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">Fechar água, proteger o piso de fora e os ralos. Fotografar tudo.</text>
<circle cx="56.00" cy="188.00" r="8.00" fill="#ffffff" stroke="#000000" stroke-width="1.00"/>
<text x="56.0" y="191.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">2</text>
<text x="72.0" y="191.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#000000" font-weight="bold" text-anchor="start">Desmontagem.</text>
<text x="72.0" y="204.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">Vaso, gabinete, vidro do box e ferragens saem inteiros e etiquetados (BE-02).</text>
<circle cx="56.00" cy="219.00" r="8.00" fill="#ffffff" stroke="#000000" stroke-width="1.00"/>
<text x="56.0" y="222.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">3</text>
<text x="72.0" y="222.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#000000" font-weight="bold" text-anchor="start">Demolição.</text>
<text x="72.0" y="235.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">Forro, revestimento das paredes, piso e base. Não tocar na área técnica nem na laje.</text>
<circle cx="56.00" cy="250.00" r="8.00" fill="#ffff00" stroke="#000000" stroke-width="1.00"/>
<text x="56.0" y="253.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">4</text>
<text x="72.0" y="253.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#000000" font-weight="bold" text-anchor="start">Levantamento de obra.</text>
<text x="72.0" y="266.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">Medir o banheiro no osso, o esgoto do vaso, os dois ralos e a coluna de água quente. Corrigir as folhas se as medidas mudarem.</text>
<circle cx="56.00" cy="281.00" r="8.00" fill="#ffff00" stroke="#000000" stroke-width="1.00"/>
<text x="56.0" y="284.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">5</text>
<text x="72.0" y="284.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#000000" font-weight="bold" text-anchor="start">Água quente da pia.</text>
<text x="72.0" y="297.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">Tê na coluna do chuveiro, registro, ramal a +1245 com isolamento. Teste de pressão com o rasgo aberto (BE-06).</text>
<circle cx="56.00" cy="312.00" r="8.00" fill="#ffffff" stroke="#000000" stroke-width="1.00"/>
<text x="56.0" y="315.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">6</text>
<text x="72.0" y="315.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#000000" font-weight="bold" text-anchor="start">Esgoto e ralos.</text>
<text x="72.0" y="328.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">Corpo do ralo linear R1, ajuste do R2 e do ponto do vaso para o nível novo (BE-05).</text>
<circle cx="56.00" cy="343.00" r="8.00" fill="#ffffff" stroke="#000000" stroke-width="1.00"/>
<text x="56.0" y="346.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">7</text>
<text x="72.0" y="346.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#000000" font-weight="bold" text-anchor="start">Elétrica embutida.</text>
<text x="72.0" y="359.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">Descidas para T17, T20 e comandos; esperas no forro para D1, D2, L3 e exaustor (BE-07).</text>
<circle cx="56.00" cy="374.00" r="8.00" fill="#ffff00" stroke="#000000" stroke-width="1.00"/>
<text x="56.0" y="377.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">8</text>
<text x="72.0" y="377.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#000000" font-weight="bold" text-anchor="start">Regularização e caimentos.</text>
<text x="72.0" y="390.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">Contrapiso com os níveis da BE-03: box a -10 e -25, piso seco com 0,5% para o R2.</text>
<circle cx="56.00" cy="405.00" r="8.00" fill="#ffff00" stroke="#000000" stroke-width="1.00"/>
<text x="56.0" y="408.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">9</text>
<text x="72.0" y="408.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#000000" font-weight="bold" text-anchor="start">Impermeabilização.</text>
<text x="72.0" y="421.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">Reforços, membrana e teste de estanqueidade de 72 horas, com registro (BE-04).</text>
<circle cx="738.00" cy="157.00" r="8.00" fill="#ffffff" stroke="#000000" stroke-width="1.00"/>
<text x="738.0" y="160.0" font-family="Helvetica, Arial, sans-serif" font-size="7.0" fill="#000000" font-weight="bold" text-anchor="middle">10</text>
<text x="754.0" y="160.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#000000" font-weight="bold" text-anchor="start">Revestimento das paredes.</text>
<text x="754.0" y="173.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">Bleu Nuit conforme BE-12 a BE-17, de baixo para cima, a partir do eixo de cada parede. Conferir calibre e tonalidade do lote antes.</text>
<circle cx="738.00" cy="188.00" r="8.00" fill="#ffffff" stroke="#000000" stroke-width="1.00"/>
<text x="738.0" y="191.0" font-family="Helvetica, Arial, sans-serif" font-size="7.0" fill="#000000" font-weight="bold" text-anchor="middle">11</text>
<text x="754.0" y="191.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#000000" font-weight="bold" text-anchor="start">Piso Confete.</text>
<text x="754.0" y="204.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">Assentar conforme BE-11, com os cortes do box nas linhas de caimento. Perfil de metal no vão da porta.</text>
<circle cx="738.00" cy="219.00" r="8.00" fill="#ffff00" stroke="#000000" stroke-width="1.00"/>
<text x="738.0" y="222.0" font-family="Helvetica, Arial, sans-serif" font-size="7.0" fill="#000000" font-weight="bold" text-anchor="middle">12</text>
<text x="754.0" y="222.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#000000" font-weight="bold" text-anchor="start">Rejunte.</text>
<text x="754.0" y="235.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">Rejunte acrílico Quartzolit nas juntas de 2 mm. Depois de rejuntar, esperar 5 dias antes de molhar ou liberar o uso, conforme o fabricante.</text>
<circle cx="738.00" cy="250.00" r="8.00" fill="#ffffff" stroke="#000000" stroke-width="1.00"/>
<text x="738.0" y="253.0" font-family="Helvetica, Arial, sans-serif" font-size="7.0" fill="#000000" font-weight="bold" text-anchor="middle">13</text>
<text x="754.0" y="253.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#000000" font-weight="bold" text-anchor="start">Forro.</text>
<text x="754.0" y="266.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">Gesso resistente à umidade a +2500, com os furos de 53 e 34 mm das luminárias FAS (BE-08).</text>
<circle cx="738.00" cy="281.00" r="8.00" fill="#ffffff" stroke="#000000" stroke-width="1.00"/>
<text x="738.0" y="284.0" font-family="Helvetica, Arial, sans-serif" font-size="7.0" fill="#000000" font-weight="bold" text-anchor="middle">14</text>
<text x="754.0" y="284.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#000000" font-weight="bold" text-anchor="start">Pintura do forro.</text>
<text x="754.0" y="297.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">Antes de instalar luminárias, vidro e louças.</text>
<circle cx="738.00" cy="312.00" r="8.00" fill="#ffffff" stroke="#000000" stroke-width="1.00"/>
<text x="738.0" y="315.0" font-family="Helvetica, Arial, sans-serif" font-size="7.0" fill="#000000" font-weight="bold" text-anchor="middle">15</text>
<text x="754.0" y="315.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#000000" font-weight="bold" text-anchor="start">Bancada e gabinete.</text>
<text x="754.0" y="328.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">Gabinete no lugar, tampo B01 com saia, cuba e metais (BE-09). Espelho por último.</text>
<circle cx="738.00" cy="343.00" r="8.00" fill="#ffffff" stroke="#000000" stroke-width="1.00"/>
<text x="738.0" y="346.0" font-family="Helvetica, Arial, sans-serif" font-size="7.0" fill="#000000" font-weight="bold" text-anchor="middle">16</text>
<text x="754.0" y="346.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#000000" font-weight="bold" text-anchor="start">Vaso.</text>
<text x="754.0" y="359.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">Anel de vedação novo, bacia aparafusada, engate novo. Testar descarga (BE-05).</text>
<circle cx="738.00" cy="374.00" r="8.00" fill="#ffffff" stroke="#000000" stroke-width="1.00"/>
<text x="738.0" y="377.0" font-family="Helvetica, Arial, sans-serif" font-size="7.0" fill="#000000" font-weight="bold" text-anchor="middle">17</text>
<text x="754.0" y="377.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#000000" font-weight="bold" text-anchor="start">Box, porta e elétrica.</text>
<text x="754.0" y="390.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">Vidro do box, porta P02 (BE-10), luminárias, toalheiro, tomadas e exaustor.</text>
<circle cx="738.00" cy="405.00" r="8.00" fill="#ffff00" stroke="#000000" stroke-width="1.00"/>
<text x="738.0" y="408.0" font-family="Helvetica, Arial, sans-serif" font-size="7.0" fill="#000000" font-weight="bold" text-anchor="middle">18</text>
<text x="754.0" y="408.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#000000" font-weight="bold" text-anchor="start">Entrega.</text>
<text x="754.0" y="421.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">Teste de todos os pontos de água, quente e fria, dos ralos, das luzes e do toalheiro. Só então liberar o uso.</text>
<circle cx="55.00" cy="887.00" r="4.50" fill="#ffff00" stroke="#000000" stroke-width="0.90"/>
<text x="68.0" y="890.0" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="normal" text-anchor="start">Liberação: o serviço seguinte só começa depois de conferido</text>
<circle cx="305.21" cy="887.00" r="4.50" fill="#ffffff" stroke="#000000" stroke-width="0.90"/>
<text x="318.2" y="890.0" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="normal" text-anchor="start">Serviço</text>
</svg>