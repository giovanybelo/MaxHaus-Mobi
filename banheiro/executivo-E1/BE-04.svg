<rect x="247.50" y="872.00" width="14.00" height="10.00" fill="#9fe8f0" stroke="#8c8c8c" stroke-width="0.60"/>
<text x="267.5" y="880.0" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="normal" text-anchor="start">Box e rodapé de 300</text>
<rect x="365.26" y="872.00" width="14.00" height="10.00" fill="#00ffff" stroke="#8c8c8c" stroke-width="0.60"/>
<text x="385.3" y="880.0" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="normal" text-anchor="start">Parede do box até +2500</text>
<text x="760.0" y="142.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="start" letter-spacing="1.00">ÁREAS A IMPERMEABILIZAR</text>
<rect x="760.00" y="150.00" width="592.00" height="17.00" fill="#e0e0e0"/>
<text x="766.0" y="161.2" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="start">ID</text>
<text x="813.4" y="161.2" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="start">Onde</text>
<text x="1346.0" y="161.2" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="end">Até onde</text>
<text x="766.0" y="178.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">I1</text>
<text x="813.4" y="178.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">Todo o piso do banheiro, inclusive sob a bancada e o vão da porta</text>
<text x="1346.0" y="178.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">avança 300 mm para fora da porta</text>
<line x1="760.00" y1="184.00" x2="1352.00" y2="184.00" stroke="#cccccc" stroke-width="0.50"/>
<rect x="760.00" y="184.00" width="592.00" height="17.00" fill="#f5f5f5"/>
<text x="766.0" y="195.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">I2</text>
<text x="813.4" y="195.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">Piso do box e as três paredes do box, com a face da área técnica</text>
<text x="1346.0" y="195.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">do piso ao forro (+2500)</text>
<line x1="760.00" y1="201.00" x2="1352.00" y2="201.00" stroke="#cccccc" stroke-width="0.50"/>
<text x="766.0" y="212.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">I3</text>
<text x="813.4" y="212.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">Rodapé nas paredes fora do box</text>
<text x="1346.0" y="212.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">300 mm acima do piso pronto</text>
<line x1="760.00" y1="218.00" x2="1352.00" y2="218.00" stroke="#cccccc" stroke-width="0.50"/>
<rect x="760.00" y="218.00" width="592.00" height="17.00" fill="#f5f5f5"/>
<text x="766.0" y="229.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">I4</text>
<text x="813.4" y="229.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">Nicho do box: fundo, laterais, base e teto</text>
<text x="1346.0" y="229.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">base com caimento para dentro do box</text>
<line x1="760.00" y1="235.00" x2="1352.00" y2="235.00" stroke="#cccccc" stroke-width="0.50"/>
<text x="766.0" y="246.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">I5</text>
<text x="813.4" y="246.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">Ralos R1 e R2 e passagens de tubo</text>
<text x="1346.0" y="246.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">flange e reforço com tela</text>
<line x1="760.00" y1="252.00" x2="1352.00" y2="252.00" stroke="#cccccc" stroke-width="0.50"/>
<rect x="760.00" y="252.00" width="592.00" height="17.00" fill="#f5f5f5"/>
<text x="766.0" y="263.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">I6</text>
<text x="813.4" y="263.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">Parede da bancada, atrás da cuba</text>
<text x="1346.0" y="263.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">faixa de +700 a +1400</text>
<line x1="760.00" y1="269.00" x2="1352.00" y2="269.00" stroke="#cccccc" stroke-width="0.50"/>
<circle cx="768.00" cy="296.00" r="8.00" fill="#ffff00" stroke="#000000" stroke-width="1.00"/>
<text x="768.0" y="299.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">1</text>
<text x="784.0" y="299.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Base pronta.</text>
<text x="784.0" y="311.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Regularização com os caimentos já feitos (BE-03), cantos arredondados em meia-cana, superfície firme, seca e limpa.</text>
<circle cx="768.00" cy="325.00" r="8.00" fill="#ffffff" stroke="#000000" stroke-width="1.00"/>
<text x="768.0" y="328.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">2</text>
<text x="784.0" y="328.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Reforços primeiro.</text>
<text x="784.0" y="340.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Tela de poliéster em todos os cantos, no encontro piso-parede, em volta dos tubos e nas flanges dos dois ralos.</text>
<circle cx="768.00" cy="354.00" r="8.00" fill="#ffffff" stroke="#000000" stroke-width="1.00"/>
<text x="768.0" y="357.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">3</text>
<text x="784.0" y="357.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Membrana.</text>
<text x="784.0" y="369.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Cimentício flexível ou sistema equivalente, no número de demãos e no consumo da ficha do fabricante. Demãos cruzadas, respeitando o intervalo entre</text>
<text x="784.0" y="381.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">elas.</text>
<circle cx="768.00" cy="395.00" r="8.00" fill="#ffff00" stroke="#000000" stroke-width="1.00"/>
<text x="768.0" y="398.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">4</text>
<text x="784.0" y="398.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Teste de estanqueidade: 72 horas.</text>
<text x="784.0" y="410.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Tampar os ralos, encher com 3 a 5 cm de água e marcar o nível. Não pode baixar nem aparecer mancha no vizinho de baixo. Registrar com foto e</text>
<text x="784.0" y="422.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">data. Só depois proteger e revestir.</text>
<circle cx="768.00" cy="436.00" r="8.00" fill="#ffffff" stroke="#000000" stroke-width="1.00"/>
<text x="768.0" y="439.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">5</text>
<text x="784.0" y="439.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Proteção.</text>
<text x="784.0" y="451.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Camada de proteção mecânica antes da argamassa do piso. Qualquer furo feito depois é selado antes de fechar.</text>
<text x="760.0" y="476.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Sistema e consumo.</text>
<text x="760.0" y="488.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Referência de planejamento: ~12 m², com reserva. O produto, o primer e o tempo de cura são definidos com o responsável técnico e precisam ser</text>
<text x="760.0" y="500.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">compatíveis com o porcelanato e com a argamassa.</text>
</svg>