<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 990" width="1400" height="990">
<rect x="0.00" y="0.00" width="1400.00" height="990.00" fill="#ffffff"/>
<text x="48.0" y="42.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4d4d4d" font-weight="bold" text-anchor="start" letter-spacing="1.40">MAXHAUS 81  ·  BANHEIRO  ·  CADERNO TÉCNICO</text>
<text x="48.0" y="76.0" font-family="Helvetica, Arial, sans-serif" font-size="24.0" fill="#000000" font-weight="bold" text-anchor="start">Elétrica, forro e iluminação da FAS</text>
<text x="48.0" y="97.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">Pontos, cargas a confirmar e a compatibilização do forro com as luminárias compradas.</text>
<text x="1352.0" y="42.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#ff00ff" font-weight="bold" text-anchor="end" letter-spacing="0.80">E1  ·  14/11/2026</text>
<text x="1352.0" y="78.0" font-family="Helvetica, Arial, sans-serif" font-size="22.0" fill="#000000" font-weight="bold" text-anchor="end">BT-05</text>
<text x="1352.0" y="97.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="end">escala sem escala  ·  A3, imprimir a 100%</text>
<line x1="48.00" y1="112.00" x2="1352.00" y2="112.00" stroke="#cccccc" stroke-width="1.00"/>
<line x1="48.00" y1="928.00" x2="1352.00" y2="928.00" stroke="#cccccc" stroke-width="1.00"/>
<text x="48.0" y="944.0" font-family="Helvetica, Arial, sans-serif" font-size="7.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">Cotas em mm, em faces acabadas; nível ±0 = piso pronto. Medidas de 14/11/2026 informadas pelo cliente + modelo R95. Conferir em obra depois da demolição e antes de cortar qualquer peça.</text>
<text x="48.0" y="956.0" font-family="Helvetica, Arial, sans-serif" font-size="7.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">Orientação de escopo, não laudo: instalações, estrutura e impermeabilização pedem responsável técnico em obra.</text>
<text x="48.0" y="975.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#ff00ff" font-weight="bold" text-anchor="start" letter-spacing="0.50">MAXHAUS 81  ·  JOÃO BALDINATO 109  ·  BANHEIRO  ·  CADERNO TÉCNICO</text>
<text x="1352.0" y="975.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="end">BT-05   ·   E1  ·  14/11/2026</text>
<text x="48.0" y="142.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="start" letter-spacing="1.00">PONTOS</text>
<rect x="48.00" y="150.00" width="630.00" height="17.00" fill="#e0e0e0"/>
<text x="54.0" y="161.2" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="start">ID</text>
<text x="104.4" y="161.2" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="start">Ponto</text>
<text x="356.4" y="161.2" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="start">Dado</text>
<text x="54.0" y="178.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">T20</text>
<text x="104.4" y="178.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">Toalheiro térmico, acima do vaso (novo)</text>
<text x="356.4" y="178.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">127 V; potência pela placa do aparelho; ligação direta na versão de fio oculto</text>
<line x1="48.00" y1="184.00" x2="678.00" y2="184.00" stroke="#cccccc" stroke-width="0.50"/>
<rect x="48.00" y="184.00" width="630.00" height="17.00" fill="#f5f5f5"/>
<text x="54.0" y="195.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">T17</text>
<text x="104.4" y="195.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">Tomada da bancada</text>
<text x="356.4" y="195.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">2P+T, a +1160, na faixa entre tampo e espelho</text>
<line x1="48.00" y1="201.00" x2="678.00" y2="201.00" stroke="#cccccc" stroke-width="0.50"/>
<text x="54.0" y="212.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">D1</text>
<text x="104.4" y="212.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">FAS Halo 7 W (TE.4106)</text>
<text x="356.4" y="212.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">embutido orientável, 2700 K, 36°; furo de 53 mm</text>
<line x1="48.00" y1="218.00" x2="678.00" y2="218.00" stroke="#cccccc" stroke-width="0.50"/>
<rect x="48.00" y="218.00" width="630.00" height="17.00" fill="#f5f5f5"/>
<text x="54.0" y="229.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">D2</text>
<text x="104.4" y="229.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">FAS Tiny 5,8 W IP (TE.4676)</text>
<text x="356.4" y="229.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">embutido para o box, 2700 K, 36°, bivolt; furo de 34 mm</text>
<line x1="48.00" y1="235.00" x2="678.00" y2="235.00" stroke="#cccccc" stroke-width="0.50"/>
<text x="54.0" y="246.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">L3</text>
<text x="104.4" y="246.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">Perfil linear do espelho (existente)</text>
<text x="356.4" y="246.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">reinstalar; fonte fora da área de respingos</text>
<line x1="48.00" y1="252.00" x2="678.00" y2="252.00" stroke="#cccccc" stroke-width="0.50"/>
<rect x="48.00" y="252.00" width="630.00" height="17.00" fill="#f5f5f5"/>
<text x="54.0" y="263.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">EX01</text>
<text x="104.4" y="263.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">Exaustor no forro</text>
<text x="356.4" y="263.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">vazão de referência 91 m³/h; duto e saída a levantar</text>
<line x1="48.00" y1="269.00" x2="678.00" y2="269.00" stroke="#cccccc" stroke-width="0.50"/>
<text x="54.0" y="280.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">S03 / S04</text>
<text x="104.4" y="280.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">Comandos</text>
<text x="356.4" y="280.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">fora do banheiro, ao norte da porta, a +1100</text>
<line x1="48.00" y1="286.00" x2="678.00" y2="286.00" stroke="#cccccc" stroke-width="0.50"/>
<text x="48.0" y="312.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#000000" font-weight="bold" text-anchor="start">Proteção.</text>
<text x="48.0" y="324.2" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">Circuitos do banheiro com DR de 30 mA e terra. Dimensionamento, bitola e disjuntor pelo eletricista, depois do levantamento do quadro, que tem 17 anos.</text>
<text x="48.0" y="343.4" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#000000" font-weight="bold" text-anchor="start">Toalheiro.</text>
<text x="48.0" y="355.6" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">O ponto T20 fica no eixo do vaso, atrás do aparelho (550 × 370 mm, base a +989). Confirmar a variante comprada: a de fio oculto não usa tomada.</text>
<text x="48.0" y="374.8" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#000000" font-weight="bold" text-anchor="start">Exaustão.</text>
<text x="48.0" y="387.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">Não descarregar no vão do forro nem em shaft sem duto. Rota e saída dependem do condomínio.</text>
<text x="730.0" y="142.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="start" letter-spacing="1.00">PROJETO DE ILUMINAÇÃO FAS</text>
<rect x="730.00" y="150.00" width="622.00" height="17.00" fill="#e0e0e0"/>
<text x="736.0" y="161.2" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="start">Item</text>
<text x="947.5" y="161.2" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="start">Dado</text>
<text x="736.0" y="178.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Pedido FAS</text>
<text x="947.5" y="178.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">22804, de 06/11/2026; entrega prevista para a semana de 21/12/2026</text>
<line x1="730.00" y1="184.00" x2="1352.00" y2="184.00" stroke="#cccccc" stroke-width="0.50"/>
<rect x="730.00" y="184.00" width="622.00" height="17.00" fill="#f5f5f5"/>
<text x="736.0" y="195.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Banheiro</text>
<text x="947.5" y="195.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">1 Halo 7 W + 1 Tiny 5,8 W IP</text>
<line x1="730.00" y1="201.00" x2="1352.00" y2="201.00" stroke="#cccccc" stroke-width="0.50"/>
<text x="736.0" y="212.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Folha F02 (detalhes)</text>
<text x="947.5" y="212.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">nicho de 53 mm (D1) e de 34 mm (D2); altura mínima de 100 mm acima do forro</text>
<line x1="730.00" y1="218.00" x2="1352.00" y2="218.00" stroke="#cccccc" stroke-width="0.50"/>
<rect x="730.00" y="218.00" width="622.00" height="17.00" fill="#f5f5f5"/>
<text x="736.0" y="229.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Situação</text>
<text x="947.5" y="229.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">folha carimbada "aguardando aprovação"</text>
<line x1="730.00" y1="235.00" x2="1352.00" y2="235.00" stroke="#cccccc" stroke-width="0.50"/>
<text x="736.0" y="246.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Folha F01 (planta)</text>
<text x="947.5" y="246.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">não recebida: posições desta emissão vêm do modelo R95</text>
<line x1="730.00" y1="252.00" x2="1352.00" y2="252.00" stroke="#cccccc" stroke-width="0.50"/>
<text x="730.0" y="278.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#000000" font-weight="bold" text-anchor="start">Forro a +2500.</text>
<text x="730.0" y="290.2" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">Laje a +2620 menos forro de 15 mm: sobram 105 mm para a luminária, contra 100 mm pedidos pela FAS. A folga é de 5 mm. Medir a laje depois de tirar o</text>
<text x="730.0" y="302.4" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">forro antigo; se faltar altura, o forro desce e o revestimento acompanha.</text>
<text x="730.0" y="321.6" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#000000" font-weight="bold" text-anchor="start">Entrega em dezembro.</text>
<text x="730.0" y="333.8" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">As luminárias chegam depois do forro pronto. Deixar os furos marcados e fazer com a peça em mãos, ou furar pelo gabarito da FAS.</text>
<text x="730.0" y="353.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#000000" font-weight="bold" text-anchor="start">Caderno geral.</text>
<text x="730.0" y="365.2" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">O Caderno Alternativo A ainda cita forro novo a 2,40 m e duas luminárias embutidas genéricas. Para o banheiro vale este caderno.</text>
</svg>