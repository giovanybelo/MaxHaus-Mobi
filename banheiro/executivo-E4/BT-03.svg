<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 990" width="1400" height="990">
<rect x="0.00" y="0.00" width="1400.00" height="990.00" fill="#ffffff"/>
<text x="48.0" y="42.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4d4d4d" font-weight="bold" text-anchor="start" letter-spacing="1.40">MAXHAUS 81  ·  BANHEIRO  ·  CADERNO TÉCNICO</text>
<text x="48.0" y="76.0" font-family="Helvetica, Arial, sans-serif" font-size="24.0" fill="#000000" font-weight="bold" text-anchor="start">Piso, rebaixo e impermeabilização: critérios</text>
<text x="48.0" y="97.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">O que se exige de cada sistema, como se confere e o que não se aceita.</text>
<text x="1352.0" y="42.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#ff00ff" font-weight="bold" text-anchor="end" letter-spacing="0.80">E4  ·  16/11/2026</text>
<text x="1352.0" y="78.0" font-family="Helvetica, Arial, sans-serif" font-size="22.0" fill="#000000" font-weight="bold" text-anchor="end">BT-03</text>
<text x="1352.0" y="97.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="end">escala sem escala  ·  A3, imprimir a 100%</text>
<line x1="48.00" y1="112.00" x2="1352.00" y2="112.00" stroke="#cccccc" stroke-width="1.00"/>
<line x1="48.00" y1="928.00" x2="1352.00" y2="928.00" stroke="#cccccc" stroke-width="1.00"/>
<text x="48.0" y="944.0" font-family="Helvetica, Arial, sans-serif" font-size="7.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">Cotas em mm, em faces acabadas; nível ±0 = piso pronto. Medidas de 14/11/2026 informadas pelo cliente + modelo R95. Conferir em obra depois da demolição e antes de cortar qualquer peça.</text>
<text x="48.0" y="956.0" font-family="Helvetica, Arial, sans-serif" font-size="7.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">Orientação de escopo, não laudo: instalações, estrutura e impermeabilização pedem responsável técnico em obra.</text>
<text x="48.0" y="975.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#ff00ff" font-weight="bold" text-anchor="start" letter-spacing="0.50">MAXHAUS 81  ·  JOÃO BALDINATO 109  ·  BANHEIRO  ·  CADERNO TÉCNICO</text>
<text x="1352.0" y="975.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="end">BT-03   ·   E4  ·  16/11/2026</text>
<text x="48.0" y="142.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="start" letter-spacing="1.00">COMPOSIÇÃO DO PISO DO BANHEIRO</text>
<rect x="48.00" y="150.00" width="630.00" height="17.00" fill="#e0e0e0"/>
<text x="54.0" y="161.2" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="start">Camada, de cima para baixo</text>
<text x="457.8" y="161.2" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="end">Espessura</text>
<text x="672.0" y="161.2" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="end">Observação</text>
<text x="54.0" y="178.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Porcelanato Confete 100 × 100</text>
<text x="457.8" y="178.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">9 mm</text>
<text x="672.0" y="178.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">conferir o lote</text>
<line x1="48.00" y1="184.00" x2="678.00" y2="184.00" stroke="#cccccc" stroke-width="0.50"/>
<rect x="48.00" y="184.00" width="630.00" height="17.00" fill="#f5f5f5"/>
<text x="54.0" y="195.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Argamassa colante</text>
<text x="457.8" y="195.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">~5 mm</text>
<text x="672.0" y="195.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">premissa de cálculo</text>
<line x1="48.00" y1="201.00" x2="678.00" y2="201.00" stroke="#cccccc" stroke-width="0.50"/>
<text x="54.0" y="212.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Proteção mecânica</text>
<text x="457.8" y="212.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">conforme sistema</text>
<text x="672.0" y="212.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">sobre a membrana</text>
<line x1="48.00" y1="218.00" x2="678.00" y2="218.00" stroke="#cccccc" stroke-width="0.50"/>
<rect x="48.00" y="218.00" width="630.00" height="17.00" fill="#f5f5f5"/>
<text x="54.0" y="229.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Impermeabilização</text>
<text x="457.8" y="229.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">conforme sistema</text>
<text x="672.0" y="229.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">ver BE-04</text>
<line x1="48.00" y1="235.00" x2="678.00" y2="235.00" stroke="#cccccc" stroke-width="0.50"/>
<text x="54.0" y="246.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Regularização com caimento</text>
<text x="457.8" y="246.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">variável</text>
<text x="672.0" y="246.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">define os níveis</text>
<line x1="48.00" y1="252.00" x2="678.00" y2="252.00" stroke="#cccccc" stroke-width="0.50"/>
<rect x="48.00" y="252.00" width="630.00" height="17.00" fill="#f5f5f5"/>
<text x="54.0" y="263.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Laje</text>
<text x="457.8" y="263.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">-</text>
<text x="672.0" y="263.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">não rebaixar</text>
<line x1="48.00" y1="269.00" x2="678.00" y2="269.00" stroke="#cccccc" stroke-width="0.50"/>
<text x="48.0" y="295.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#000000" font-weight="bold" text-anchor="start">Nível único com a sala.</text>
<text x="48.0" y="307.2" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">O piso pronto do banheiro fica no mesmo nível do monolítico Sinesse Pro (2 a 4 mm). Para isso a base do banheiro fica 10 a 12 mm abaixo da base da sala,</text>
<text x="48.0" y="319.4" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">mais a espessura da impermeabilização e da proteção. Não há soleira: a troca de piso é marcada por um perfil de metal de 3 mm à vista, com junta elástica.</text>
<text x="48.0" y="338.6" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#000000" font-weight="bold" text-anchor="start">Quanto rebaixar.</text>
<text x="48.0" y="350.8" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">Não é um número fixo: é a diferença entre a base que existir depois da demolição e a base alvo. A empreiteira mede, registra e só então decide se regulariza ou se</text>
<text x="48.0" y="363.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">retira contrapiso. A laje não se corta.</text>
<text x="48.0" y="382.2" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#000000" font-weight="bold" text-anchor="start">Risco conhecido: esgoto contra nível.</text>
<text x="48.0" y="394.4" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">O esgoto mora no rebaixo antigo. Com o piso no nível da casa, impermeabilização, caimento e piso têm de caber entre a laje e o ±0 e os ralos precisam manter</text>
<text x="48.0" y="406.6" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">queda. Se não couber, a decisão volta ao cliente antes de seguir: ou o piso do banheiro sobe alguns milímetros, ou o caimento diminui.</text>
<text x="48.0" y="425.8" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#000000" font-weight="bold" text-anchor="start">Caimentos.</text>
<text x="48.0" y="438.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">Box: ~1,5% para o ralo linear, de -10 na entrada a -25 no ralo. Piso seco: 0,5% para o ralo ao lado do vaso. Feitos na regularização, nunca na argamassa do</text>
<text x="48.0" y="450.2" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">porcelanato.</text>
<text x="730.0" y="142.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="start" letter-spacing="1.00">IMPERMEABILIZAÇÃO</text>
<rect x="730.00" y="150.00" width="622.00" height="17.00" fill="#e0e0e0"/>
<text x="736.0" y="161.2" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="start">Critério</text>
<text x="947.5" y="161.2" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="start">Exigência</text>
<text x="736.0" y="178.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Área</text>
<text x="947.5" y="178.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">todo o piso, paredes do box até +2500, rodapé de 300 no resto, nicho, faixa da cuba</text>
<line x1="730.00" y1="184.00" x2="1352.00" y2="184.00" stroke="#cccccc" stroke-width="0.50"/>
<rect x="730.00" y="184.00" width="622.00" height="17.00" fill="#f5f5f5"/>
<text x="736.0" y="195.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Sistema</text>
<text x="947.5" y="195.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">membrana flexível compatível com porcelanato e argamassa; definir produto com o responsável técnico</text>
<line x1="730.00" y1="201.00" x2="1352.00" y2="201.00" stroke="#cccccc" stroke-width="0.50"/>
<text x="736.0" y="212.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Reforços</text>
<text x="947.5" y="212.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">tela em cantos, encontro piso-parede, tubos e flanges dos ralos</text>
<line x1="730.00" y1="218.00" x2="1352.00" y2="218.00" stroke="#cccccc" stroke-width="0.50"/>
<rect x="730.00" y="218.00" width="622.00" height="17.00" fill="#f5f5f5"/>
<text x="736.0" y="229.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Ensaio</text>
<text x="947.5" y="229.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">lâmina de água de 3 a 5 cm por 72 horas, com foto e data</text>
<line x1="730.00" y1="235.00" x2="1352.00" y2="235.00" stroke="#cccccc" stroke-width="0.50"/>
<text x="736.0" y="246.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Aceite</text>
<text x="947.5" y="246.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">nível não baixa; sem mancha na laje de baixo; ralos estanques</text>
<line x1="730.00" y1="252.00" x2="1352.00" y2="252.00" stroke="#cccccc" stroke-width="0.50"/>
<rect x="730.00" y="252.00" width="622.00" height="17.00" fill="#f5f5f5"/>
<text x="736.0" y="263.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Depois do ensaio</text>
<text x="947.5" y="263.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">proteção mecânica; furo novo só com selagem</text>
<line x1="730.00" y1="269.00" x2="1352.00" y2="269.00" stroke="#cccccc" stroke-width="0.50"/>
<text x="730.0" y="295.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#000000" font-weight="bold" text-anchor="start">Rejunte: 5 dias de espera.</text>
<text x="730.0" y="307.2" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">Rejunte acrílico Quartzolit nas paredes e no piso. Depois de aplicado, aguardar 5 dias antes de molhar ou liberar o uso das áreas rejuntadas, conforme</text>
<text x="730.0" y="319.4" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">orientação do fabricante. Esse prazo entra no cronograma: o box só recebe água depois dele.</text>
<text x="730.0" y="338.6" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#000000" font-weight="bold" text-anchor="start">Porcelanato no box.</text>
<text x="730.0" y="350.8" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">Cortar nas quebras de plano do caimento; não empenar placa de 1 m. Conferir na ficha do lote se o acabamento serve para piso molhado.</text>
<text x="730.0" y="370.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#000000" font-weight="bold" text-anchor="start">Não se aceita.</text>
<text x="730.0" y="382.2" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">Caimento corrigido com argamassa do piso; membrana aplicada sobre base úmida ou solta; ensaio sem registro; ralo assentado depois da membrana;</text>
<text x="730.0" y="394.4" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">revestimento antes do ensaio.</text>
<text x="730.0" y="413.6" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#000000" font-weight="bold" text-anchor="start">Responsabilidade.</text>
<text x="730.0" y="425.8" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">Estas folhas orientam o escopo. Produto, consumo, cura e garantia da impermeabilização são do aplicador e do responsável técnico da obra.</text>
</svg>