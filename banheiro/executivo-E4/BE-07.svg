<rect x="760.00" y="286.00" width="592.00" height="17.00" fill="#f5f5f5"/>
<text x="766.0" y="297.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">S03</text>
<text x="825.2" y="297.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">Interruptor existente do espelho</text>
<text x="1346.0" y="297.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">manter posição; trocar comando e espelho</text>
<line x1="760.00" y1="303.00" x2="1352.00" y2="303.00" stroke="#cccccc" stroke-width="0.50"/>
<text x="760.0" y="329.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Regra desta obra.</text>
<text x="760.0" y="341.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Toda a fiação é trocada pelos eletrodutos existentes; nenhum ponto muda de lugar. Nas tomadas, troca o espelho; nos interruptores, o espelho e o</text>
<text x="760.0" y="353.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">comando. A única saída nova é o T20.</text>
<text x="760.0" y="372.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">O T20 é o ponto do toalheiro.</text>
<text x="760.0" y="384.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Fica na parede do vaso, no eixo dele, atrás do toalheiro (550 × 370 mm, base a +989). A versão de fio oculto liga direto na caixa, sem plugue: conferir a</text>
<text x="760.0" y="396.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">interface com a peça comprada antes de fechar a parede.</text>
<text x="760.0" y="415.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Proteção.</text>
<text x="760.0" y="427.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Todos os circuitos do banheiro com DR de 30 mA e condutor de terra. Nada de emenda solta dentro da parede. Respeitar os volumes do box: nenhum</text>
<text x="760.0" y="439.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">ponto de força dentro dele.</text>
<text x="760.0" y="458.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Interruptores do lado da dobradiça.</text>
<text x="760.0" y="470.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Com a porta abrindo em sentido anti-horário, S03 e S04 ficam do lado da dobradiça, a 880 mm de parede livre ao norte do vão. Conferir se o alcance fica</text>
<text x="760.0" y="482.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">bom com a folha aberta.</text>
<text x="760.0" y="501.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Fiação pelo forro.</text>
<text x="760.0" y="513.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">O forro novo a +2500 deixa 120 mm até a laje para os cabos de D1, D2 e exaustor. A descida do T20 é a única nova: embutida, feita antes da</text>
<text x="760.0" y="525.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">impermeabilização e do revestimento.</text>
</svg>