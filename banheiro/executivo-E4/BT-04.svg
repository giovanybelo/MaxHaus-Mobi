<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 990" width="1400" height="990">
<rect x="0.00" y="0.00" width="1400.00" height="990.00" fill="#ffffff"/>
<text x="48.0" y="42.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4d4d4d" font-weight="bold" text-anchor="start" letter-spacing="1.40">MAXHAUS 81  ·  BANHEIRO  ·  CADERNO TÉCNICO</text>
<text x="48.0" y="76.0" font-family="Helvetica, Arial, sans-serif" font-size="24.0" fill="#000000" font-weight="bold" text-anchor="start">Hidráulica: água quente, esgoto e ralos</text>
<text x="48.0" y="97.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#4d4d4d" font-weight="normal" text-anchor="start">Memorial das instalações hidráulicas. Traçados de intenção: a rede embutida não foi levantada.</text>
<text x="1352.0" y="42.0" font-family="Helvetica, Arial, sans-serif" font-size="9.0" fill="#ff00ff" font-weight="bold" text-anchor="end" letter-spacing="0.80">E4  ·  16/11/2026</text>
<text x="1352.0" y="78.0" font-family="Helvetica, Arial, sans-serif" font-size="22.0" fill="#000000" font-weight="bold" text-anchor="end">BT-04</text>
<text x="1352.0" y="97.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="end">escala sem escala  ·  A3, imprimir a 100%</text>
<line x1="48.00" y1="112.00" x2="1352.00" y2="112.00" stroke="#cccccc" stroke-width="1.00"/>
<line x1="48.00" y1="928.00" x2="1352.00" y2="928.00" stroke="#cccccc" stroke-width="1.00"/>
<text x="48.0" y="944.0" font-family="Helvetica, Arial, sans-serif" font-size="7.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">Cotas em mm, em faces acabadas; nível ±0 = piso pronto. Medidas de 14/11/2026 informadas pelo cliente + modelo R95. Conferir em obra depois da demolição e antes de cortar qualquer peça.</text>
<text x="48.0" y="956.0" font-family="Helvetica, Arial, sans-serif" font-size="7.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">Orientação de escopo, não laudo: instalações, estrutura e impermeabilização pedem responsável técnico em obra.</text>
<text x="48.0" y="975.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#ff00ff" font-weight="bold" text-anchor="start" letter-spacing="0.50">MAXHAUS 81  ·  JOÃO BALDINATO 109  ·  BANHEIRO  ·  CADERNO TÉCNICO</text>
<text x="1352.0" y="975.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="end">BT-04   ·   E4  ·  16/11/2026</text>
<text x="48.0" y="142.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="start" letter-spacing="1.00">RAMAL DE ÁGUA QUENTE DA PIA</text>
<rect x="48.00" y="150.00" width="630.00" height="17.00" fill="#e0e0e0"/>
<text x="54.0" y="161.2" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="start">Item</text>
<text x="243.0" y="161.2" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="start">Definição</text>
<text x="54.0" y="178.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Origem</text>
<text x="243.0" y="178.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">coluna de água quente do chuveiro, dentro da área técnica AT-B</text>
<line x1="48.00" y1="184.00" x2="678.00" y2="184.00" stroke="#cccccc" stroke-width="0.50"/>
<rect x="48.00" y="184.00" width="630.00" height="17.00" fill="#f5f5f5"/>
<text x="54.0" y="195.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Fonte de calor</text>
<text x="243.0" y="195.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">aquecedor a gás do apartamento (AT-A, no closet); sem alteração no gás</text>
<line x1="48.00" y1="201.00" x2="678.00" y2="201.00" stroke="#cccccc" stroke-width="0.50"/>
<text x="54.0" y="212.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Percurso</text>
<text x="243.0" y="212.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">tê na coluna, registro, ~0,3 m dentro da AT-B e ~0,8 m embutido na parede da bancada, a +1245</text>
<line x1="48.00" y1="218.00" x2="678.00" y2="218.00" stroke="#cccccc" stroke-width="0.50"/>
<rect x="48.00" y="218.00" width="630.00" height="17.00" fill="#f5f5f5"/>
<text x="54.0" y="229.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Tubo</text>
<text x="243.0" y="229.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">CPVC ou PPR de 22 mm, conforme o material da rede existente; transição certificada se mudar</text>
<line x1="48.00" y1="235.00" x2="678.00" y2="235.00" stroke="#cccccc" stroke-width="0.50"/>
<text x="54.0" y="246.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Isolamento</text>
<text x="243.0" y="246.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">polietileno expandido em todo o ramal</text>
<line x1="48.00" y1="252.00" x2="678.00" y2="252.00" stroke="#cccccc" stroke-width="0.50"/>
<rect x="48.00" y="252.00" width="630.00" height="17.00" fill="#f5f5f5"/>
<text x="54.0" y="263.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Chegada</text>
<text x="243.0" y="263.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">comando de água quente da pia, à esquerda de quem usa; água fria existente à direita</text>
<line x1="48.00" y1="269.00" x2="678.00" y2="269.00" stroke="#cccccc" stroke-width="0.50"/>
<text x="54.0" y="280.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Acesso</text>
<text x="243.0" y="280.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">registro do ramal atrás de uma tampa de inspeção na face da área técnica</text>
<line x1="48.00" y1="286.00" x2="678.00" y2="286.00" stroke="#cccccc" stroke-width="0.50"/>
<rect x="48.00" y="286.00" width="630.00" height="17.00" fill="#f5f5f5"/>
<text x="54.0" y="297.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Teste</text>
<text x="243.0" y="297.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">pressão com o rasgo aberto por pelo menos 6 horas; depois, tempo de chegada da água quente</text>
<line x1="48.00" y1="303.00" x2="678.00" y2="303.00" stroke="#cccccc" stroke-width="0.50"/>
<text x="48.0" y="329.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#000000" font-weight="bold" text-anchor="start">Por que derivar do chuveiro.</text>
<text x="48.0" y="341.2" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">É o ponto de água quente mais perto da pia e já está dentro da área técnica, que tem acesso. O ramal fica curto, com pouca água parada: a água quente chega</text>
<text x="48.0" y="353.4" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">rápido e perde pouco calor.</text>
<text x="48.0" y="372.6" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#000000" font-weight="bold" text-anchor="start">O que conferir antes.</text>
<text x="48.0" y="384.8" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">Material e diâmetro da coluna existente; pressão e vazão com chuveiro e pia abertos juntos; se o aquecedor acende com a vazão baixa de uma torneira de</text>
<text x="48.0" y="397.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">lavatório. Se não acender, avaliar com o instalador antes de fechar a parede.</text>
<text x="48.0" y="416.2" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#000000" font-weight="bold" text-anchor="start">O que não fazer.</text>
<text x="48.0" y="428.4" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">Ligar quente e fria por um tê simples; embutir flexível; fazer emenda sem acesso; mexer na tubulação de gás; fechar a parede sem teste.</text>
<text x="48.0" y="447.6" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#000000" font-weight="bold" text-anchor="start">Altura dos metais.</text>
<text x="48.0" y="459.8" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">Com o tampo a +980, os comandos ficam a +1245 e a bica a +1250, 265 mm acima do tampo. Conferir alcance do jato e a cuba escolhida antes de furar.</text>
<text x="730.0" y="142.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="start" letter-spacing="1.00">ESGOTO E RALOS</text>
<rect x="730.00" y="150.00" width="622.00" height="17.00" fill="#e0e0e0"/>
<text x="736.0" y="161.2" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="start">Ponto</text>
<text x="872.8" y="161.2" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#4d4d4d" font-weight="bold" text-anchor="start">Serviço</text>
<text x="736.0" y="178.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">R1 · ralo linear</text>
<text x="872.8" y="178.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">corpo novo de 720 × 90 no box, flange colada na membrana, borda a -25; conferir saída, sifão e vazão do modelo</text>
<line x1="730.00" y1="184.00" x2="1352.00" y2="184.00" stroke="#cccccc" stroke-width="0.50"/>
<rect x="730.00" y="184.00" width="622.00" height="27.20" fill="#f5f5f5"/>
<text x="736.0" y="195.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">R2 · ao lado do vaso</text>
<text x="872.8" y="195.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">manter caixa sifonada e saída; trocar o porta-grelha por grelha oculta 100 × 100; prolongador até o piso novo; manter fecho hídrico e</text>
<text x="872.8" y="205.4" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">acesso</text>
<line x1="730.00" y1="211.20" x2="1352.00" y2="211.20" stroke="#cccccc" stroke-width="0.50"/>
<text x="736.0" y="222.4" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Vaso</text>
<text x="872.8" y="222.4" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">reaproveitado; ponto de esgoto DN100 com a boca rente ao piso novo; anel de vedação e engate novos; bacia aparafusada</text>
<line x1="730.00" y1="228.20" x2="1352.00" y2="228.20" stroke="#cccccc" stroke-width="0.50"/>
<rect x="730.00" y="228.20" width="622.00" height="17.00" fill="#f5f5f5"/>
<text x="736.0" y="239.4" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">Prumada</text>
<text x="872.8" y="239.4" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">a área técnica é prumada do condomínio: não demolir, não desviar</text>
<line x1="730.00" y1="245.20" x2="1352.00" y2="245.20" stroke="#cccccc" stroke-width="0.50"/>
<text x="730.0" y="271.2" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#000000" font-weight="bold" text-anchor="start">Levantamento obrigatório.</text>
<text x="730.0" y="283.4" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">Com o piso aberto, medir centro e profundidade de cada ponto de esgoto e o sentido de escoamento. As posições do R2 e do esgoto do vaso nas plantas</text>
<text x="730.0" y="295.6" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">são do modelo, não de medição.</text>
<text x="730.0" y="314.8" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#000000" font-weight="bold" text-anchor="start">Queda.</text>
<text x="730.0" y="327.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">Todo ramal de esgoto mantém queda até a prumada depois do rebaixo. É a verificação que libera a regularização (BT-03).</text>
<text x="730.0" y="346.2" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#000000" font-weight="bold" text-anchor="start">Registros.</text>
<text x="730.0" y="358.4" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">Aproveitar a obra para trocar registros antigos do banheiro e identificar o registro geral. Ensaio de estanqueidade da rede de água antes de fechar qualquer</text>
<text x="730.0" y="370.6" font-family="Helvetica, Arial, sans-serif" font-size="8.6" fill="#4d4d4d" font-weight="normal" text-anchor="start">rasgo.</text>
</svg>