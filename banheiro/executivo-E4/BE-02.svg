<text x="813.4" y="280.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">Área técnica do chuveiro (AT-B): prumada do condomínio. Preservar e proteger</text>
<text x="1346.0" y="280.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">800 × 250 mm</text>
<line x1="760.00" y1="286.00" x2="1352.00" y2="286.00" stroke="#cccccc" stroke-width="0.50"/>
<circle cx="768.00" cy="313.00" r="8.00" fill="#ffff00" stroke="#000000" stroke-width="1.00"/>
<text x="768.0" y="316.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">1</text>
<text x="784.0" y="316.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Fechar a água e proteger.</text>
<text x="784.0" y="328.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Fechar os registros, proteger ralos e o piso de fora do banheiro. Fotografar todas as paredes antes de quebrar.</text>
<circle cx="768.00" cy="342.00" r="8.00" fill="#ffffff" stroke="#000000" stroke-width="1.00"/>
<text x="768.0" y="345.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">2</text>
<text x="784.0" y="345.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Desmontar o que volta.</text>
<text x="784.0" y="357.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Vaso, gabinete, vidro do box e ferragens saem inteiros, etiquetados, para um lugar seco.</text>
<circle cx="768.00" cy="371.00" r="8.00" fill="#ffffff" stroke="#000000" stroke-width="1.00"/>
<text x="768.0" y="374.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">3</text>
<text x="784.0" y="374.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Forro e paredes.</text>
<text x="784.0" y="386.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Retirar o forro e o revestimento das paredes de cima para baixo. Em volta da AT-B, só ferramenta manual.</text>
<circle cx="768.00" cy="400.00" r="8.00" fill="#ffff00" stroke="#000000" stroke-width="1.00"/>
<text x="768.0" y="403.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">4</text>
<text x="784.0" y="403.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Piso.</text>
<text x="784.0" y="415.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Retirar piso e argamassa sem romper a impermeabilização antiga mais do que o necessário. Não cortar laje, viga nem pilar.</text>
<circle cx="768.00" cy="429.00" r="8.00" fill="#ffff00" stroke="#000000" stroke-width="1.00"/>
<text x="768.0" y="432.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">5</text>
<text x="784.0" y="432.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Medir antes de reconstruir.</text>
<text x="784.0" y="444.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Com a parede no osso: comprimento e largura por dentro, prumo, posição do esgoto do vaso, dos dois ralos e dos registros do chuveiro. Anotar</text>
<text x="784.0" y="456.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">na BT-02. Só depois liberar regularização e impermeabilização.</text>
