<text x="813.4" y="229.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">Retirar o forro existente; volta novo a +2500</text>
<text x="1346.0" y="229.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">3,81 m²</text>
<line x1="760.00" y1="235.00" x2="1352.00" y2="235.00" stroke="#cccccc" stroke-width="0.50"/>
<text x="766.0" y="246.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">M1</text>
<text x="813.4" y="246.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">Desmontar o vaso com caixa acoplada, tampar o esgoto e guardar</text>
<text x="1346.0" y="246.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">1 peça</text>
<line x1="760.00" y1="252.00" x2="1352.00" y2="252.00" stroke="#cccccc" stroke-width="0.50"/>
<rect x="760.00" y="252.00" width="592.00" height="17.00" fill="#f5f5f5"/>
