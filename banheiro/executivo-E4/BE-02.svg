<text x="813.4" y="263.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">Desmontar vidro e ferragens do box, etiquetar e proteger</text>
<text x="1346.0" y="263.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">1 conjunto</text>
<line x1="760.00" y1="269.00" x2="1352.00" y2="269.00" stroke="#cccccc" stroke-width="0.50"/>
