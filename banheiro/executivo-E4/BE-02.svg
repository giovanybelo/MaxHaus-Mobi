<text x="766.0" y="195.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#000000" font-weight="bold" text-anchor="start">D2</text>
<text x="813.4" y="195.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="start">Retirar o revestimento de todas as paredes, até o forro atual</text>
<text x="1346.0" y="195.2" font-family="Helvetica, Arial, sans-serif" font-size="7.8" fill="#4d4d4d" font-weight="normal" text-anchor="end">~19,5 m² (medir)</text>
<line x1="760.00" y1="201.00" x2="1352.00" y2="201.00" stroke="#cccccc" stroke-width="0.50"/>
