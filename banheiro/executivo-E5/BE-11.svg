<text x="760.0" y="296.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Quantidade.</text>
<text x="760.0" y="308.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">3,46 m² líquidos em 7 peças. Cabem em 5 placas de 100 × 100; comprar 6 (3 caixas de 2), uma de reserva. Refazer o plano de corte com as medidas</text>
<text x="760.0" y="320.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">tiradas depois da demolição.</text>
<text x="760.0" y="339.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Box.</text>
<text x="760.0" y="351.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">O porcelanato do box é cortado nas quebras de plano do caimento (BE-03 e BE-05). Não empenar placa de 1 m para fazer caimento. Recortes de ralo e</text>
<text x="760.0" y="363.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">de vaso só com gabarito.</text>
<text x="760.0" y="382.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Juntas.</text>
<text x="760.0" y="394.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">2 mm entre placas, 3 mm no perímetro com junta elástica. Rejunte acrílico claro, próximo da cor do Confete, próprio para área molhada.</text>
<text x="760.0" y="413.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Antiderrapante.</text>
<text x="760.0" y="425.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Conferir na ficha do lote se o acabamento do Confete atende piso de box. Se não atender, usar no box a versão antiderrapante da mesma linha.</text>
</svg>