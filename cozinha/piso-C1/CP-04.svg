<line x1="270.00" y1="731.00" x2="326.95" y2="847.00" stroke="#4d4d4d" stroke-width="0.50"/>
<circle cx="270.00" cy="731.00" r="1.60" fill="#000000"/>
<text x="90.0" y="850.0" font-family="Helvetica, Arial, sans-serif" font-size="6.6" fill="#000000" font-weight="normal" text-anchor="start">sob a KC1 e o closet o rodapé é da marcenaria; a faixa de 30 mm fica escondida</text>
<circle cx="648.00" cy="157.00" r="8.00" fill="#ffff00" stroke="#000000" stroke-width="1.00"/>
<text x="648.0" y="160.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">1</text>
<text x="664.0" y="160.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Duto da coifa e elétrica do teto.</text>
<text x="664.0" y="172.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">DU2 e CF01 (CP-05) fixados sob a laje antes do piso: escada e furação de laje não combinam com porcelanato novo. Os pontos da R04 descem pela laje, não pelo piso.</text>
<circle cx="648.00" cy="186.00" r="8.00" fill="#ffffff" stroke="#000000" stroke-width="1.00"/>
<text x="648.0" y="189.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">2</text>
<text x="664.0" y="189.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Demolição e contrapiso.</text>
<text x="664.0" y="201.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Sair as duas paredes antigas, recompor o contrapiso nas faixas e acertar a cota com o monolítico (P06).</text>
<circle cx="648.00" cy="215.00" r="8.00" fill="#ffff00" stroke="#000000" stroke-width="1.00"/>
<text x="648.0" y="218.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">3</text>
<text x="664.0" y="218.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Medição de obra.</text>
<text x="664.0" y="230.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Largura em três pontos, comprimento, degrau e o arco. Se a largura mudar, refazer a faixa de ajuste.</text>
<circle cx="648.00" cy="244.00" r="8.00" fill="#ffffff" stroke="#000000" stroke-width="1.00"/>
<text x="648.0" y="247.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">4</text>
<text x="664.0" y="247.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Perfil de transição.</text>
<text x="664.0" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Reto no norte e na passagem do closet; flexível no arco de 700. Fixado e nivelado antes das placas.</text>
<circle cx="648.00" cy="273.00" r="8.00" fill="#ffffff" stroke="#000000" stroke-width="1.00"/>
<text x="648.0" y="276.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">5</text>
<text x="664.0" y="276.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Assentamento.</text>
<text x="664.0" y="288.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Do ponto M (CP-02) para sul e oeste, dupla colagem, niveladores de placa. Fiada A, curva, degrau e faixas por último.</text>
<circle cx="648.00" cy="302.00" r="8.00" fill="#ffffff" stroke="#000000" stroke-width="1.00"/>
<text x="648.0" y="305.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">6</text>
<text x="664.0" y="305.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Rejunte e cura.</text>
<text x="664.0" y="317.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Rejunte acrílico na cor do Confete; selante no perímetro. 7 dias sem carga pesada.</text>
<circle cx="648.00" cy="331.00" r="8.00" fill="#ffffff" stroke="#000000" stroke-width="1.00"/>
<text x="648.0" y="334.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">7</text>
<text x="664.0" y="334.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Monolítico.</text>
<text x="664.0" y="346.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Aplicado contra o perfil já fixado (corredor, sala de TV, quarto).</text>
<circle cx="648.00" cy="360.00" r="8.00" fill="#ffff00" stroke="#000000" stroke-width="1.00"/>
<text x="648.0" y="363.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">8</text>
<text x="664.0" y="363.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">R04 e AT-A sobre o piso.</text>
<text x="664.0" y="375.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">Guia com banda acústica, fixada por bucha. O nicho AT-A em material incombustível, com a liberação do instalador credenciado.</text>
<circle cx="648.00" cy="389.00" r="8.00" fill="#ffffff" stroke="#000000" stroke-width="1.00"/>
<text x="648.0" y="392.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" fill="#000000" font-weight="bold" text-anchor="middle">9</text>
<text x="664.0" y="392.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#000000" font-weight="bold" text-anchor="start">Marcenaria.</text>
<text x="664.0" y="404.0" font-family="Helvetica, Arial, sans-serif" font-size="8.4" fill="#4d4d4d" font-weight="normal" text-anchor="start">KC1, geladeira e closet M01 só com o piso curado e protegido.</text>
<text x="640.0" y="445.0" font-family="Helvetica, Arial, sans-serif" font-size="8.2" fill="#000000" font-weight="bold" text-anchor="start">Juntas de movimentação.</text>
<text x="640.0" y="456.6" font-family="Helvetica, Arial, sans-serif" font-size="8.2" fill="#4d4d4d" font-weight="normal" text-anchor="start">A zona tem 11,72 m² e o lado maior 5,82 m: abaixo dos limites da NBR 13753 para área interna, não pede junta intermediária. Ficam só a folga do perímetro e as transições.</text>
<text x="640.0" y="475.2" font-family="Helvetica, Arial, sans-serif" font-size="8.2" fill="#000000" font-weight="bold" text-anchor="start">Proteção.</text>
<text x="640.0" y="486.8" font-family="Helvetica, Arial, sans-serif" font-size="8.2" fill="#4d4d4d" font-weight="normal" text-anchor="start">Do rejunte até a entrega: papelão ondulado e lona sobre todo o piso. A R04, o AT-A, a marcenaria e o duto da coifa sobem com o piso protegido.</text>
</svg>